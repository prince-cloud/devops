# EKS cluster definition used by up.sh and down.sh
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: Three-Tier-K8s-EKS-Cluster
  region: us-east-1

iam:
  withOIDC: true
  serviceAccounts:
    - metadata:
        name: aws-load-balancer-controller
        namespace: kube-system
      roleName: AmazonEKSLoadBalancerControllerRole
      attachPolicyARNs:
        - arn:aws:iam::457736183500:policy/AWSLoadBalancerControllerIAMPolicy

managedNodeGroups:
  - name: ng-medium
    instanceType: t2.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
